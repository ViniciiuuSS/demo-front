<div>
    <input type="text" #inputPesquisa (input)="inputPesquisa.value = $event.target.value" placeholder="Pesquisar por CPF" />
    <button (click)="getClienteByCpf(inputPesquisa.value)">Pesquisar</button>
    <input type="text" #inputNome (input)="inputNome.value = $event.target.value" placeholder="Nome"/>
    <input type="text" #inputCpf (input)="inputCpf.value = $event.target.value" placeholder="CPF"/>
    <button (click)="postCliente(inputCpf.value, inputNome.value)">Incluir</button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-shadow-2">
  <!-- Position Column -->
  <ng-container matColumnDef="#">
    <th mat-header-cell *matHeaderCellDef> # </th>
    <td mat-cell *matCellDef="let element"> {{element.clicod}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let element"> <input type="text" [value]="element.nome" (input)="element.nome = $event.target.value"> </td>
  </ng-container>

  <!-- Weight Column -->
  <ng-container matColumnDef="cpf">
    <th mat-header-cell *matHeaderCellDef> CPF </th>
    <td mat-cell *matCellDef="let element"> <input type="text" [value]="element.cpf" (input)="element.cpf = $event.target.value"> </td>
  </ng-container>

  <!-- Symbol Column -->
  <ng-container matColumnDef="edicao">
    <th mat-header-cell *matHeaderCellDef> Edição </th>
    <td mat-cell *matCellDef="let element">
        <button (click)="putCliente(element)">Editar</button>
        <button (click)="deleteCliente(element.cpf)">Deletar</button> 
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
